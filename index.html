<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>新郎商事 RECORDS</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:20px;background:#080808;color:#fff;font-family:-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center}

.player{width:100%;max-width:390px;padding:24px;border-radius:18px;background:linear-gradient(160deg,#292929,#121212)}

.label{font-size:11px;letter-spacing:2px;color:#1ed760;font-weight:bold}

.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin-top:20px}

h1{font-size:23px;margin:20px 0 6px}

.artist{font-size:14px;color:#b3b3b3}

audio{width:100%;margin-top:25px;accent-color:#1ed760}

button{display:block;margin:18px auto 0;width:64px;height:64px;border:0;border-radius:50%;background:#1ed760;color:#111;font-size:27px}

.note{text-align:center;color:#aaa;font-size:11px;margin-top:15px}

</style>

</head>

<body>

<div class="player">

  <div class="label">SHINRO SHOJI RECORDS</div>

  <img class="cover" src="IMG_0551.jpeg" alt="Album cover">

  <h1>オリジナル・サウンドトラック</h1>

  <div class="artist">新郎商事株式会社</div>

  <audio id="audio" controls preload="metadata">

    <source src="テニピ！ Homage SUMI..." type="audio/mpeg">

    お使いのブラウザは音声再生に対応していません。

  </audio>

  <div class="note">PLAY YOUR SOUND</div>

</div>

</body>

</html>
